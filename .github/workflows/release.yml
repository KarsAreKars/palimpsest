name: Release Palimpsest

# One-click release packaging: push a `v*` tag and the macOS DMG lands on the
# GitHub Release. No Apple Developer account required — the app is ad-hoc
# signed (Gatekeeper will warn on first open; right-click > Open bypasses it).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: true

jobs:
  build-macos-dmg:
    runs-on: macos-15 # Apple Silicon (aarch64) — matches the owner's local build
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # foliate-js, tao, tauri plugins, turso plugin

      - uses: pnpm/action-setup@v4 # version read from packageManager in root package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Vendor pdf.js / simplecc / jieba assets
        run: pnpm --filter @palimpsest/app setup-vendors

      - name: Install Rust stable (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # Ad-hoc signed build (no APPLE_* secrets). Future: add a matrix leg or
      # switch to `--target universal-apple-darwin` for x86_64 Macs once an
      # Apple Developer identity exists, and pass --config
      # src-tauri/tauri.macos-nonestore.conf.json for hardened-runtime signing.
      - name: Build DMG (ad-hoc signed)
        working-directory: apps/readest-app
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm tauri build --target aarch64-apple-darwin --bundles dmg

      - name: Publish DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/readest-app/src-tauri/target/release/bundle/dmg/*.dmg
          generate_release_notes: true
